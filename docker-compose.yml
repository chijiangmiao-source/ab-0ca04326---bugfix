services:
  app:
    build: .
    image: interlock-ot:latest
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DATA_FILE: /data/state.json
    ports:
      # 宿主机端口可配置：APP_PORT=9000 docker compose up
      - "${APP_PORT:-8000}:8000"
    volumes:
      - interlock-data:/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status==200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 20

  # 验收服务：等待 app 健康后依次执行业务复核、代码测试、构建检查与
  # 接口冒烟；全部完成即退出，容器退出码即验收结论（0 通过 / 1 失败）。
  # 运行：docker compose up --build --abort-on-container-exit --exit-code-from verify
  verify:
    build: .
    image: interlock-ot:latest
    command: ["python", "scripts/verify.py"]
    working_dir: /app
    environment:
      APP_URL: http://app:8000
      PYTHONPATH: /app
    depends_on:
      app:
        condition: service_healthy

volumes:
  interlock-data:
